# Local development stack. `docker compose up` must work on a clean machine.
#   - db      : Postgres 16 with pgvector + btree_gist
#   - redis   : queue backend for ARQ
#   - api     : the FastAPI app, hot-reloading on code changes
#   - worker  : the ARQ worker (knowledge-base ingestion), same image as api
#
# Day-to-day you can also run just the infra (`docker compose up db redis`) and
# start the app/worker on the host with `uv run uvicorn ...` / `uv run arq ...`.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sadyba
      POSTGRES_PASSWORD: sadyba
      POSTGRES_DB: sadyba
    ports:
      # Host 5433 -> container 5432: avoids clashing with a native Postgres on 5432.
      # Inside compose, other services still reach this as db:5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sadyba -d sadyba"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment: &app_env
      ENVIRONMENT: local
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://sadyba:sadyba@db:5432/sadyba
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      HF_HOME: /app/.cache/huggingface  # only the worker downloads a model, but harmless on api too
    ports:
      - "8000:8000"
    volumes: &app_volumes
      - .:/app                    # bind-mount source for hot reload
      - /app/.venv                # keep the container's Linux venv, don't let the host's shadow it
      - uploads_data:/app/data/uploads  # survive container restarts/rebuilds
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: uv run arq app.jobs.ingest_worker.WorkerSettings
    environment: *app_env
    volumes:
      - .:/app
      - /app/.venv
      - uploads_data:/app/data/uploads
      - hf_cache:/app/.cache/huggingface  # the embedding model, downloaded once
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  uploads_data:
  hf_cache:
