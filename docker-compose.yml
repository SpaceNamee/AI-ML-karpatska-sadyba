# Local development stack. `docker compose up` must work on a clean machine.
#   - db     : Postgres 16 with pgvector + btree_gist
#   - redis  : queue backend for ARQ (added in a later sprint day)
#   - api    : the FastAPI app, hot-reloading on code changes
#
# Day-to-day you can also run just the infra (`docker compose up db redis`) and
# start the app on the host with `uv run uvicorn app.main:app --reload`.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sadyba
      POSTGRES_PASSWORD: sadyba
      POSTGRES_DB: sadyba
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sadyba -d sadyba"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: local
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://sadyba:sadyba@db:5432/sadyba
    ports:
      - "8000:8000"
    volumes:
      - .:/app          # bind-mount source for hot reload
      - /app/.venv      # keep the container's Linux venv, don't let the host's shadow it
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
