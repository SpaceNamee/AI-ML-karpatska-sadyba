[project]
name = "karpatska-sadyba"
version = "0.1.0"
description = "AI&ML project"
readme = "README.md"
authors = [
    { name = "Marianna", email = "mariannabenkalovych@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (import sorting)
    "UP",       # pyupgrade (modern syntax)
    "B",        # flake8-bugbear (likely bugs)
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
    "ASYNC",    # flake8-async (async footguns)
    "RUF",      # ruff-specific rules
]
ignore = [
    # RUF001-003 flag Cyrillic letters as "ambiguous" look-alikes of Latin ones.
    # That rule protects against homoglyph tricks in English-language code; this
    # project's domain content (docstrings, seed data, later prompts) is
    # genuinely Ukrainian, so it would flag nearly every literal in `app/db/seed.py`.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
